name: ci

on:
  # Temporarily manual-only while routine development uses the documented local
  # gates. Dispatch the full matrix only for selected cross-platform checkpoints.
  workflow_dispatch:
    inputs:
      include_viewer:
        description: Run the optional macOS viewer PoC gate
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shared: "OFF"
          - os: macos-15
            shared: "OFF"
          - os: ubuntu-latest
            shared: "ON"
          - os: macos-15
            shared: "ON"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26.3 (macOS)
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install Expat (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libexpat1-dev liblz4-dev libssl-dev libzstd-dev zlib1g-dev
      - name: Install Expat (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install expat lz4 openssl@3 zstd
          echo "CMAKE_PREFIX_PATH=$(brew --prefix expat);$(brew --prefix lz4);$(brew --prefix openssl@3);$(brew --prefix zstd)" >> "$GITHUB_ENV"
      - name: Configure (Unix)
        run: >-
          cmake -S . -B build
          -DMMXISF_BUILD_TESTS=ON
          -DMMXISF_BUILD_VIEWER=OFF
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install package
        run: cmake --install build --config Release --prefix install
      - name: Configure installed-package consumer (Unix)
        run: |
          dependency_args=()
          linkage=static
          if [ "${{ matrix.shared }}" = ON ]; then
            linkage=shared
            dependency_args+=(
              -DCMAKE_DISABLE_FIND_PACKAGE_EXPAT=TRUE
              -DCMAKE_DISABLE_FIND_PACKAGE_LZ4=TRUE
              -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=TRUE
              -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=TRUE
              -DCMAKE_DISABLE_FIND_PACKAGE_ZSTD=TRUE
            )
          fi
          cmake --no-warn-unused-cli \
            -S tests/package_consumer -B build-consumer \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install" \
            -DMMXISF_EXPECTED_PACKAGE_PREFIX="${{ github.workspace }}/install" \
            -DMMXISF_EXPECTED_LINKAGE="$linkage" \
            -DCMAKE_BUILD_TYPE=Release \
            "${dependency_args[@]}"
      - name: Build installed-package consumer
        run: cmake --build build-consumer --config Release
      - name: Test installed-package consumer
        run: ctest --test-dir build-consumer -C Release --output-on-failure
      - name: Test relocated installed package (Unix)
        run: |
          dependency_args=()
          linkage=static
          if [ "${{ matrix.shared }}" = ON ]; then
            linkage=shared
            dependency_args+=(
              -DCMAKE_DISABLE_FIND_PACKAGE_EXPAT=TRUE
              -DCMAKE_DISABLE_FIND_PACKAGE_LZ4=TRUE
              -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=TRUE
              -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=TRUE
              -DCMAKE_DISABLE_FIND_PACKAGE_ZSTD=TRUE
            )
          fi
          cmake -E copy_directory install install-relocated
          cmake --no-warn-unused-cli \
            -S tests/package_consumer -B build-consumer-relocated \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install-relocated" \
            -DMMXISF_EXPECTED_PACKAGE_PREFIX="${{ github.workspace }}/install-relocated" \
            -DMMXISF_EXPECTED_LINKAGE="$linkage" \
            -DCMAKE_BUILD_TYPE=Release \
            "${dependency_args[@]}"
          cmake --build build-consumer-relocated --config Release
          ctest --test-dir build-consumer-relocated -C Release --output-on-failure
      - name: Configure source-subdirectory consumer (Unix)
        run: >-
          cmake -S tests/subdirectory_consumer -B build-subdirectory-consumer
          -DMMXISF_SOURCE_DIR=${{ github.workspace }}
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DCMAKE_BUILD_TYPE=Release
      - name: Build and test source-subdirectory consumer
        run: |
          cmake --build build-subdirectory-consumer --config Release
          ctest --test-dir build-subdirectory-consumer -C Release --output-on-failure
      - name: Retain resolved binary SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mmxisf-binary-sbom-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shared }}-${{ github.sha }}
          path: build/binary-dependencies.spdx.json
          if-no-files-found: error
          retention-days: 14

  viewer-poc:
    if: ${{ inputs.include_viewer }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install dependencies
        run: |
          brew install expat lz4 openssl@3 zstd
          echo "CMAKE_PREFIX_PATH=$(brew --prefix expat);$(brew --prefix lz4);$(brew --prefix openssl@3);$(brew --prefix zstd)" >> "$GITHUB_ENV"
      - name: Configure optional viewer PoC
        run: >-
          cmake -S . -B build-viewer
          -DMMXISF_BUILD_TESTS=ON
          -DMMXISF_BUILD_VIEWER=ON
          -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_BUILD_TYPE=Release
          -DMMXISF_VIEWER_OUTPUT_DIR=${{ github.workspace }}/artifacts
      - name: Build and test optional viewer PoC
        run: |
          cmake --build build-viewer --config Release
          ctest --test-dir build-viewer -C Release --output-on-failure
          codesign --verify --deep --strict --verbose=2 "artifacts/mmXISF Viewer PoC.app"

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies once
        run: vcpkg install expat:x64-windows lz4:x64-windows openssl:x64-windows zlib:x64-windows zstd:x64-windows
      - name: Configure static library
        run: >-
          cmake -S . -B build-static -A x64
          -DMMXISF_BUILD_TESTS=ON
          -DMMXISF_BUILD_VIEWER=OFF
          -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build and test static library
        run: |
          cmake --build build-static --config Release
          ctest --test-dir build-static -C Release --output-on-failure
          cmake --install build-static --config Release --prefix install-static
      - name: Test installed static package
        run: |
          cmake -S tests/package_consumer -B consumer-static -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install-static" `
            -DMMXISF_EXPECTED_PACKAGE_PREFIX="${{ github.workspace }}/install-static" `
            -DMMXISF_EXPECTED_LINKAGE=static `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build consumer-static --config Release
          ctest --test-dir consumer-static -C Release --output-on-failure
          cmake -E copy_directory install-static install-static-relocated
          cmake -S tests/package_consumer -B consumer-static-relocated -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install-static-relocated" `
            -DMMXISF_EXPECTED_PACKAGE_PREFIX="${{ github.workspace }}/install-static-relocated" `
            -DMMXISF_EXPECTED_LINKAGE=static `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build consumer-static-relocated --config Release
          ctest --test-dir consumer-static-relocated -C Release --output-on-failure
      - name: Test static source-subdirectory consumption
        run: |
          cmake -S tests/subdirectory_consumer -B subdirectory-consumer-static -A x64 `
            -DMMXISF_SOURCE_DIR="${{ github.workspace }}" `
            -DBUILD_SHARED_LIBS=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build subdirectory-consumer-static --config Release
          ctest --test-dir subdirectory-consumer-static -C Release --output-on-failure
      - name: Configure shared library
        run: >-
          cmake -S . -B build-shared -A x64
          -DMMXISF_BUILD_TESTS=ON
          -DMMXISF_BUILD_VIEWER=OFF
          -DBUILD_SHARED_LIBS=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build, test, and install shared library
        run: |
          cmake --build build-shared --config Release
          ctest --test-dir build-shared -C Release --output-on-failure
          cmake --install build-shared --config Release --prefix install-shared
      - name: Configure installed shared package consumer
        timeout-minutes: 5
        run: >-
          cmake --no-warn-unused-cli
          -S tests/package_consumer -B consumer-shared -A x64
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install-shared"
          -DMMXISF_EXPECTED_PACKAGE_PREFIX="${{ github.workspace }}/install-shared"
          -DMMXISF_EXPECTED_LINKAGE=shared
          -DCMAKE_DISABLE_FIND_PACKAGE_EXPAT=TRUE
          -DCMAKE_DISABLE_FIND_PACKAGE_LZ4=TRUE
          -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=TRUE
          -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=TRUE
          -DCMAKE_DISABLE_FIND_PACKAGE_ZSTD=TRUE
      - name: Build installed shared package consumer
        timeout-minutes: 5
        run: cmake --build consumer-shared --config Release
      - name: Test installed shared package consumer
        timeout-minutes: 5
        run: |
          $vcpkgRuntime = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          $env:PATH = "${{ github.workspace }}\install-shared\bin;$vcpkgRuntime;$env:PATH"
          ctest --test-dir consumer-shared -C Release --output-on-failure --timeout 30
      - name: Test relocated installed shared package
        timeout-minutes: 5
        run: |
          cmake -E copy_directory install-shared install-shared-relocated
          cmake --no-warn-unused-cli `
            -S tests/package_consumer -B consumer-shared-relocated -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install-shared-relocated" `
            -DMMXISF_EXPECTED_PACKAGE_PREFIX="${{ github.workspace }}/install-shared-relocated" `
            -DMMXISF_EXPECTED_LINKAGE=shared `
            -DCMAKE_DISABLE_FIND_PACKAGE_EXPAT=TRUE `
            -DCMAKE_DISABLE_FIND_PACKAGE_LZ4=TRUE `
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=TRUE `
            -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=TRUE `
            -DCMAKE_DISABLE_FIND_PACKAGE_ZSTD=TRUE
          cmake --build consumer-shared-relocated --config Release
          $vcpkgRuntime = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          $env:PATH = "${{ github.workspace }}\install-shared-relocated\bin;$vcpkgRuntime;$env:PATH"
          ctest --test-dir consumer-shared-relocated -C Release --output-on-failure --timeout 30
      - name: Test shared source-subdirectory consumption
        run: |
          cmake -S tests/subdirectory_consumer -B subdirectory-consumer-shared -A x64 `
            -DMMXISF_SOURCE_DIR="${{ github.workspace }}" `
            -DBUILD_SHARED_LIBS=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build subdirectory-consumer-shared --config Release
          $vcpkgRuntime = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          $env:PATH = "${{ github.workspace }}\subdirectory-consumer-shared\mmxisf-source\Release;$vcpkgRuntime;$env:PATH"
          ctest --test-dir subdirectory-consumer-shared -C Release --output-on-failure --timeout 30
      - name: Retain resolved static and shared binary SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mmxisf-binary-sbom-Windows-${{ runner.arch }}-${{ github.sha }}
          path: |
            build-static/binary-dependencies.spdx.json
            build-shared/binary-dependencies.spdx.json
          if-no-files-found: error
          retention-days: 14

  source-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create deterministic source archives
        run: >-
          cmake
          -DMMXISF_SOURCE_DIR=${{ github.workspace }}
          -DMMXISF_OUTPUT_DIR=${{ github.workspace }}/dist/source-candidate
          -DMMXISF_CANDIDATE_REF=${{ github.sha }}
          -P cmake/PrepareSourceCandidate.cmake
      - name: Verify source package identity and integrity
        run: >-
          cmake
          -DMMXISF_SOURCE_DIR=${{ github.workspace }}
          -DMMXISF_CANDIDATE_DIR=${{ github.workspace }}/dist/source-candidate
          -DMMXISF_EXPECTED_COMMIT=${{ github.sha }}
          -DMMXISF_VERIFY_GIT_ARCHIVE=ON
          -P cmake/ValidateSourceCandidate.cmake
      - name: Upload source package, checksum, and identity manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mmxisf-source-${{ github.sha }}
          path: dist/source-candidate/
          if-no-files-found: error
          retention-days: 14

  api-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install documentation toolchain
        run: sudo apt-get update && sudo apt-get install -y doxygen libexpat1-dev liblz4-dev libssl-dev libzstd-dev zlib1g-dev
      - name: Configure generated API reference
        run: >-
          cmake -S . -B build-docs
          -DMMXISF_BUILD_DOCS=ON
          -DMMXISF_BUILD_TESTS=OFF
          -DMMXISF_BUILD_TOOLS=OFF
          -DCMAKE_BUILD_TYPE=Release
      - name: Generate API reference
        run: cmake --build build-docs --target mmxisf_docs
      - name: Verify generated entry point
        run: test -s build-docs/api/html/index.html
      - name: Upload generated API reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mmxisf-api-${{ github.sha }}
          path: build-docs/api/html/
          if-no-files-found: error
          retention-days: 14

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang libexpat1-dev liblz4-dev libssl-dev libzstd-dev zlib1g-dev
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-fuzz
          -DMMXISF_BUILD_TESTS=OFF
          -DMMXISF_BUILD_TOOLS=OFF
          -DMMXISF_BUILD_FUZZER=ON
          -DMMXISF_BUILD_FUZZ_SMOKE=ON
          -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-fuzz --parallel
      - name: Configure ThreadSanitizer suite
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-tsan
          -DMMXISF_BUILD_TESTS=ON
          -DMMXISF_BUILD_TOOLS=OFF
          -DMMXISF_BUILD_VIEWER=OFF
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -Wall -Wextra -Wpedantic -Werror"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"
      - name: Build and run ThreadSanitizer suite
        run: |
          cmake --build build-tsan --parallel
          ctest --test-dir build-tsan --output-on-failure
      - name: Run 20k sanitizer mutations
        run: build-fuzz/mmxisf_fuzz_smoke
      - name: Prepare coverage-guided seed corpus
        run: |
          mkdir -p build-fuzz/corpus build-fuzz/artifacts
          for seed in tests/fuzz_seed*.xisf.b64; do
            base64 --decode "$seed" > "build-fuzz/corpus/$(basename "$seed" .b64)"
          done
          for seed in tests/interop/*.xisf.b64; do
            base64 --decode "$seed" > "build-fuzz/corpus/interop-$(basename "$seed" .b64)"
          done
      - name: Run 20k coverage-guided mutations
        run: >-
          build-fuzz/mmxisf_fuzz_header
          -runs=20000
          -max_len=1048576
          -timeout=10
          -dict=tests/fuzz_header.dict
          -artifact_prefix=build-fuzz/artifacts/
          build-fuzz/corpus
      - name: Retain libFuzzer failure artifact
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libfuzzer-failure
          path: build-fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 7
