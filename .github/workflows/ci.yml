name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            viewer: OFF
            shared: "OFF"
          - os: macos-15
            viewer: ON
            shared: "OFF"
          - os: ubuntu-latest
            viewer: OFF
            shared: "ON"
          - os: macos-15
            viewer: OFF
            shared: "ON"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.3 (macOS)
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install Expat (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libexpat1-dev liblz4-dev libssl-dev libzstd-dev zlib1g-dev
      - name: Install Expat (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install expat lz4 openssl@3 zstd
          echo "CMAKE_PREFIX_PATH=$(brew --prefix expat);$(brew --prefix lz4);$(brew --prefix openssl@3);$(brew --prefix zstd)" >> "$GITHUB_ENV"
      - name: Configure (Unix)
        run: >-
          cmake -S . -B build
          -DMMXISF_BUILD_TESTS=ON
          -DMMXISF_BUILD_VIEWER=${{ matrix.viewer }}
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install package
        run: cmake --install build --config Release --prefix install
      - name: Configure installed-package consumer (Unix)
        run: >-
          cmake -S tests/package_consumer -B build-consumer
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"
          -DCMAKE_BUILD_TYPE=Release
      - name: Build installed-package consumer
        run: cmake --build build-consumer --config Release
      - name: Test installed-package consumer
        run: ctest --test-dir build-consumer -C Release --output-on-failure

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies once
        run: vcpkg install expat:x64-windows lz4:x64-windows openssl:x64-windows zlib:x64-windows zstd:x64-windows
      - name: Configure static library
        run: >-
          cmake -S . -B build-static -A x64
          -DMMXISF_BUILD_TESTS=ON
          -DMMXISF_BUILD_VIEWER=OFF
          -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build and test static library
        run: |
          cmake --build build-static --config Release
          ctest --test-dir build-static -C Release --output-on-failure
          cmake --install build-static --config Release --prefix install-static
      - name: Test installed static package
        run: |
          cmake -S tests/package_consumer -B consumer-static -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install-static" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build consumer-static --config Release
          ctest --test-dir consumer-static -C Release --output-on-failure
      - name: Configure shared library
        run: >-
          cmake -S . -B build-shared -A x64
          -DMMXISF_BUILD_TESTS=ON
          -DMMXISF_BUILD_VIEWER=OFF
          -DBUILD_SHARED_LIBS=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build, test, and install shared library
        run: |
          cmake --build build-shared --config Release
          ctest --test-dir build-shared -C Release --output-on-failure
          cmake --install build-shared --config Release --prefix install-shared
      - name: Test installed shared package
        run: |
          cmake -S tests/package_consumer -B consumer-shared -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install-shared" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build consumer-shared --config Release
          echo "${{ github.workspace }}\install-shared\bin" >> $env:GITHUB_PATH
          ctest --test-dir consumer-shared -C Release --output-on-failure

  source-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create deterministic source archives
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="mmxisf-${GITHUB_SHA}/" --output=dist/mmxisf-source.tar.gz HEAD
          git archive --format=tar.gz --prefix="mmxisf-${GITHUB_SHA}/" --output=dist/mmxisf-source-repeat.tar.gz HEAD
          cmp dist/mmxisf-source.tar.gz dist/mmxisf-source-repeat.tar.gz
          sha256sum dist/mmxisf-source.tar.gz > dist/mmxisf-source.tar.gz.sha256
          rm dist/mmxisf-source-repeat.tar.gz
      - name: Upload source package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: mmxisf-source-${{ github.sha }}
          path: |
            dist/mmxisf-source.tar.gz
            dist/mmxisf-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  api-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install documentation toolchain
        run: sudo apt-get update && sudo apt-get install -y doxygen libexpat1-dev liblz4-dev libssl-dev libzstd-dev zlib1g-dev
      - name: Configure generated API reference
        run: >-
          cmake -S . -B build-docs
          -DMMXISF_BUILD_DOCS=ON
          -DMMXISF_BUILD_TESTS=OFF
          -DMMXISF_BUILD_TOOLS=OFF
          -DCMAKE_BUILD_TYPE=Release
      - name: Generate API reference
        run: cmake --build build-docs --target mmxisf_docs
      - name: Verify generated entry point
        run: test -s build-docs/api/html/index.html
      - name: Upload generated API reference
        uses: actions/upload-artifact@v4
        with:
          name: mmxisf-api-${{ github.sha }}
          path: build-docs/api/html/
          if-no-files-found: error
          retention-days: 14

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang libexpat1-dev liblz4-dev libssl-dev libzstd-dev zlib1g-dev
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-fuzz
          -DMMXISF_BUILD_TESTS=OFF
          -DMMXISF_BUILD_TOOLS=OFF
          -DMMXISF_BUILD_FUZZER=ON
          -DMMXISF_BUILD_FUZZ_SMOKE=ON
          -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-fuzz --parallel
      - name: Run 20k sanitizer mutations
        run: build-fuzz/mmxisf_fuzz_smoke
      - name: Prepare coverage-guided seed corpus
        run: |
          mkdir -p build-fuzz/corpus build-fuzz/artifacts
          for seed in tests/fuzz_seed*.xisf.b64; do
            base64 --decode "$seed" > "build-fuzz/corpus/$(basename "$seed" .b64)"
          done
          for seed in tests/interop/*.xisf.b64; do
            base64 --decode "$seed" > "build-fuzz/corpus/interop-$(basename "$seed" .b64)"
          done
      - name: Run 20k coverage-guided mutations
        run: >-
          build-fuzz/mmxisf_fuzz_header
          -runs=20000
          -max_len=1048576
          -timeout=10
          -dict=tests/fuzz_header.dict
          -artifact_prefix=build-fuzz/artifacts/
          build-fuzz/corpus
      - name: Retain libFuzzer failure artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: libfuzzer-failure
          path: build-fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 7
