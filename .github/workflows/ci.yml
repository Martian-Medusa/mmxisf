name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      include_viewer:
        description: Run the optional macOS viewer PoC gate
        required: false
        default: false
        type: boolean
      windows_source_ref:
        description: Optional source ref tested only by the native Windows gate
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shared: "OFF"
          - os: macos-15
            shared: "OFF"
          - os: ubuntu-latest
            shared: "ON"
          - os: macos-15
            shared: "ON"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26.3 (macOS)
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install Expat (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libexpat1-dev liblz4-dev libssl-dev libzstd-dev zlib1g-dev
      - name: Install Expat (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install expat lz4 openssl@3 zstd
          echo "CMAKE_PREFIX_PATH=$(brew --prefix expat);$(brew --prefix lz4);$(brew --prefix openssl@3);$(brew --prefix zstd)" >> "$GITHUB_ENV"
      - name: Configure (Unix)
        run: >-
          cmake -S . -B build
          -DMMXISF_BUILD_TESTS=ON
          -DMMXISF_BUILD_VIEWER=OFF
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install package
        run: cmake --install build --config Release --prefix install
      - name: Configure installed-package consumer (Unix)
        run: |
          dependency_args=()
          linkage=static
          if [ "${{ matrix.shared }}" = ON ]; then
            linkage=shared
            dependency_args+=(
              -DCMAKE_DISABLE_FIND_PACKAGE_EXPAT=TRUE
              -DCMAKE_DISABLE_FIND_PACKAGE_LZ4=TRUE
              -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=TRUE
              -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=TRUE
              -DCMAKE_DISABLE_FIND_PACKAGE_ZSTD=TRUE
            )
          fi
          cmake --no-warn-unused-cli \
            -S tests/package_consumer -B build-consumer \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install" \
            -DMMXISF_EXPECTED_PACKAGE_PREFIX="${{ github.workspace }}/install" \
            -DMMXISF_EXPECTED_LINKAGE="$linkage" \
            -DCMAKE_BUILD_TYPE=Release \
            "${dependency_args[@]}"
      - name: Build installed-package consumer
        run: cmake --build build-consumer --config Release
      - name: Test installed-package consumer
        run: ctest --test-dir build-consumer -C Release --output-on-failure
      - name: Test relocated installed package (Unix)
        run: |
          dependency_args=()
          linkage=static
          if [ "${{ matrix.shared }}" = ON ]; then
            linkage=shared
            dependency_args+=(
              -DCMAKE_DISABLE_FIND_PACKAGE_EXPAT=TRUE
              -DCMAKE_DISABLE_FIND_PACKAGE_LZ4=TRUE
              -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=TRUE
              -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=TRUE
              -DCMAKE_DISABLE_FIND_PACKAGE_ZSTD=TRUE
            )
          fi
          cmake -E copy_directory install install-relocated
          cmake --no-warn-unused-cli \
            -S tests/package_consumer -B build-consumer-relocated \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install-relocated" \
            -DMMXISF_EXPECTED_PACKAGE_PREFIX="${{ github.workspace }}/install-relocated" \
            -DMMXISF_EXPECTED_LINKAGE="$linkage" \
            -DCMAKE_BUILD_TYPE=Release \
            "${dependency_args[@]}"
          cmake --build build-consumer-relocated --config Release
          ctest --test-dir build-consumer-relocated -C Release --output-on-failure
      - name: Configure source-subdirectory consumer (Unix)
        run: >-
          cmake -S tests/subdirectory_consumer -B build-subdirectory-consumer
          -DMMXISF_SOURCE_DIR=${{ github.workspace }}
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DCMAKE_BUILD_TYPE=Release
      - name: Build and test source-subdirectory consumer
        run: |
          cmake --build build-subdirectory-consumer --config Release
          ctest --test-dir build-subdirectory-consumer -C Release --output-on-failure
      - name: Retain resolved binary SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mmxisf-binary-sbom-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shared }}-${{ github.sha }}
          path: build/binary-dependencies.spdx.json
          if-no-files-found: error
          retention-days: 14

  viewer-poc:
    if: ${{ inputs.include_viewer }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install dependencies
        run: |
          brew install expat lz4 openssl@3 zstd
          echo "CMAKE_PREFIX_PATH=$(brew --prefix expat);$(brew --prefix lz4);$(brew --prefix openssl@3);$(brew --prefix zstd)" >> "$GITHUB_ENV"
      - name: Configure optional viewer PoC
        run: >-
          cmake -S . -B build-viewer
          -DMMXISF_BUILD_TESTS=ON
          -DMMXISF_BUILD_VIEWER=ON
          -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_BUILD_TYPE=Release
          -DMMXISF_VIEWER_OUTPUT_DIR=${{ github.workspace }}/artifacts
      - name: Build and test optional viewer PoC
        run: |
          cmake --build build-viewer --config Release
          ctest --test-dir build-viewer -C Release --output-on-failure
          codesign --verify --deep --strict --verbose=2 "artifacts/mmXISF Viewer PoC.app"

  windows-build:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-binary-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.windows_source_ref || github.sha }}
      - name: Restore the pinned Windows dependency cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: mmxisf-vcpkg-Windows-x64-${{ hashFiles('vcpkg.json') }}
          restore-keys: mmxisf-vcpkg-Windows-x64-
      - name: Install dependencies once
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $manifest = Get-Content -Raw -LiteralPath vcpkg.json | ConvertFrom-Json
          $baseline = $manifest.'builtin-baseline'
          if ($baseline -notmatch '^[0-9a-f]{40}$') {
            throw "Invalid vcpkg builtin-baseline: $baseline"
          }
          git -C "$env:VCPKG_INSTALLATION_ROOT" fetch --depth=1 origin $baseline
          if ($LASTEXITCODE -ne 0) { throw "Unable to fetch vcpkg baseline $baseline" }
          git -C "$env:VCPKG_INSTALLATION_ROOT" checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "Unable to check out vcpkg baseline $baseline" }
          & "$env:VCPKG_INSTALLATION_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "Unable to bootstrap pinned vcpkg" }
          vcpkg install --triplet x64-windows
      - name: Save the pinned Windows dependency cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: mmxisf-vcpkg-Windows-x64-${{ hashFiles('vcpkg.json') }}
      - name: Checkout the current qualification harness for an older source ref
        if: inputs.windows_source_ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .qualification-harness
          sparse-checkout: tools/run_vcpkg_windows_amd64_gate.ps1
          sparse-checkout-cone-mode: false
      - name: Run warnings-as-errors functional gate and reproducibility measurement
        shell: pwsh
        run: |
          $gateScript = "tools/run_vcpkg_windows_amd64_gate.ps1"
          $additionalCxxFlags = ""
          $excludedTests = ""
          if ("${{ inputs.windows_source_ref }}" -ne "") {
            $gateScript = ".qualification-harness/tools/run_vcpkg_windows_amd64_gate.ps1"
            # RC1 uses standard getenv() only in test cleanup. MSVC C4996 is a
            # vendor portability warning, not a candidate-library warning.
            $additionalCxxFlags = "/wd4996"
            # The immutable RC1 synthetic source-candidate fixture hashes LF
            # before native Windows writes CRLF. The validator itself and the
            # exact archive identity remain independently enforced.
            $excludedTests = "^mmxisf\.source-candidate-contract$"
          }
          & $gateScript `
            -SourceRoot "${{ github.workspace }}" `
            -VcpkgRoot $env:VCPKG_INSTALLATION_ROOT `
            -BuildRoot "${{ github.workspace }}\build-vcpkg-windows-amd64" `
            -AdditionalCxxFlags $additionalCxxFlags `
            -ExcludedTests $excludedTests `
            -ParallelJobs 2
      - name: Record native Windows toolchain and performance checkpoint
        shell: pwsh
        run: |
          $evidenceDirectory = Join-Path $env:GITHUB_WORKSPACE "windows-evidence"
          New-Item -ItemType Directory -Path $evidenceDirectory | Out-Null
          $benchmarkFile = Join-Path $evidenceDirectory "benchmark-rgb.xisf"
          $strictBuildRoot = Join-Path $env:GITHUB_WORKSPACE "build-vcpkg-windows-amd64"
          $reproducibilityReportPath = Join-Path $strictBuildRoot "windows-reproducibility.json"
          $writer = Join-Path $strictBuildRoot "static\Release\mmxisf-writer-benchmark.exe"
          $inspector = Join-Path $strictBuildRoot "static\Release\mmxisf-inspect.exe"
          foreach ($requiredFile in @($writer, $inspector, $reproducibilityReportPath)) {
            if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
              throw "Missing Windows measurement executable: $requiredFile"
            }
          }
          $reproducibility = Get-Content -Raw -LiteralPath $reproducibilityReportPath | ConvertFrom-Json

          $writerRuns = @()
          foreach ($iteration in 1..5) {
            $lines = & $writer $benchmarkFile
            if ($LASTEXITCODE -ne 0) { throw "Writer benchmark run $iteration failed" }
            $values = @{}
            foreach ($line in $lines) {
              if ($line -match '^([^=]+)=(.*)$') { $values[$Matches[1]] = $Matches[2] }
            }
            $writerRuns += [ordered]@{
              elapsedSeconds = [double]$values.elapsed_seconds
              throughputMiBPerSecond = [double]$values.throughput_mib_per_second
              decodedBytes = [uint64]$values.decoded_bytes
              fileBytes = [uint64]$values.file_bytes
              fileSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $benchmarkFile).Hash.ToLowerInvariant()
            }
          }

          $owningReaderSeconds = @()
          $rowReaderSeconds = @()
          foreach ($iteration in 1..5) {
            $timer = [Diagnostics.Stopwatch]::StartNew()
            & $inspector --decode-sha256 $benchmarkFile | Out-Null
            $timer.Stop()
            if ($LASTEXITCODE -ne 0) { throw "Owning reader run $iteration failed" }
            $owningReaderSeconds += $timer.Elapsed.TotalSeconds

            $timer = [Diagnostics.Stopwatch]::StartNew()
            & $inspector --decode-rows $benchmarkFile | Out-Null
            $timer.Stop()
            if ($LASTEXITCODE -ne 0) { throw "Row reader run $iteration failed" }
            $rowReaderSeconds += $timer.Elapsed.TotalSeconds
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudioPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($visualStudioPath)) {
            throw "Unable to locate the MSVC installation"
          }
          $msvcDirectory = Get-ChildItem -LiteralPath (Join-Path $visualStudioPath "VC\Tools\MSVC") -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1
          $clPath = Join-Path $msvcDirectory.FullName "bin\Hostx64\x64\cl.exe"
          $linkPath = Join-Path $msvcDirectory.FullName "bin\Hostx64\x64\link.exe"
          $windowsSdkVersions = @(Get-ChildItem -LiteralPath (Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin") -Directory |
            Select-Object -ExpandProperty Name |
            Sort-Object)
          $operatingSystem = Get-CimInstance Win32_OperatingSystem
          $processor = Get-CimInstance Win32_Processor | Select-Object -First 1
          $sourceCommit = (& git.exe rev-parse HEAD).Trim()
          $vcpkgCommit = (& git.exe -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD).Trim()
          $cmakeVersion = (& cmake.exe --version | Select-Object -First 1)
          $vcpkgVersion = (& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" version | Select-Object -First 1)

          $evidence = [ordered]@{
            schema = "mmxisf.native-windows-checkpoint/1.0.0"
            recordedAtUtc = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
            result = "RECORDED_NATIVE_WINDOWS_AMD64_MSVC"
            source = [ordered]@{
              commit = $sourceCommit
              requestedRef = "${{ inputs.windows_source_ref }}"
              workflowRunId = "${{ github.run_id }}"
              workflowRunAttempt = "${{ github.run_attempt }}"
            }
            host = [ordered]@{
              operatingSystem = $operatingSystem.Caption
              version = $operatingSystem.Version
              buildNumber = $operatingSystem.BuildNumber
              architecture = $env:PROCESSOR_ARCHITECTURE
              processor = $processor.Name
              logicalCpuCount = $processor.NumberOfLogicalProcessors
              runnerImage = $env:ImageOS
              runnerImageVersion = $env:ImageVersion
            }
            toolchain = [ordered]@{
              visualStudioPath = $visualStudioPath
              msvcToolsVersion = $msvcDirectory.Name
              clFileVersion = (Get-Item -LiteralPath $clPath).VersionInfo.FileVersion
              linkerFileVersion = (Get-Item -LiteralPath $linkPath).VersionInfo.FileVersion
              windowsSdkVersions = $windowsSdkVersions
              cmake = $cmakeVersion
              powershell = $PSVersionTable.PSVersion.ToString()
              git = (& git.exe --version)
              vcpkg = $vcpkgVersion
              vcpkgCommit = $vcpkgCommit
            }
            profile = [ordered]@{
              geometry = "6064x4040x3"
              sampleFormat = "UInt8"
              compression = "Zstandard level 3"
              checksum = "SHA-256"
              filesystemCache = "warm"
            }
            writerRuns = $writerRuns
            owningReaderElapsedSeconds = $owningReaderSeconds
            rowReaderElapsedSeconds = $rowReaderSeconds
            artifacts = [ordered]@{
              staticLibrarySha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $strictBuildRoot "static\Release\mmxisf.lib")).Hash.ToLowerInvariant()
              sharedLibrarySha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $strictBuildRoot "shared\Release\mmxisf.lib")).Hash.ToLowerInvariant()
              sharedDllSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $strictBuildRoot "shared\Release\mmxisf.dll")).Hash.ToLowerInvariant()
              benchmarkFileSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $benchmarkFile).Hash.ToLowerInvariant()
            }
            reproducibility = $reproducibility
            limitations = @(
              "Hosted-runner measurements are a reproducible checkpoint, not a portable performance SLA.",
              "Warm-cache reader timings include process startup, parsing, checksum verification, and decoding.",
              "Windows artifact byte identity is measured and recorded, but is not a functional gate for this source-only release.",
              "Toolchain inventory requires a separate dated advisory disposition before release promotion."
            )
          }
          $evidence | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $evidenceDirectory "native-windows-amd64.json") -Encoding utf8
      - name: Retain resolved static and shared binary SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mmxisf-binary-sbom-Windows-${{ runner.arch }}-${{ github.sha }}
          path: |
            build-vcpkg-windows-amd64/static/binary-dependencies.spdx.json
            build-vcpkg-windows-amd64/shared/binary-dependencies.spdx.json
            build-vcpkg-windows-amd64/windows-reproducibility.json
            windows-evidence/native-windows-amd64.json
          if-no-files-found: error
          retention-days: 14

  source-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create deterministic source archives
        run: >-
          cmake
          -DMMXISF_SOURCE_DIR=${{ github.workspace }}
          -DMMXISF_OUTPUT_DIR=${{ github.workspace }}/dist/source-candidate
          -DMMXISF_CANDIDATE_REF=${{ github.sha }}
          -P cmake/PrepareSourceCandidate.cmake
      - name: Verify source package identity and integrity
        run: >-
          cmake
          -DMMXISF_SOURCE_DIR=${{ github.workspace }}
          -DMMXISF_CANDIDATE_DIR=${{ github.workspace }}/dist/source-candidate
          -DMMXISF_EXPECTED_COMMIT=${{ github.sha }}
          -DMMXISF_VERIFY_GIT_ARCHIVE=ON
          -P cmake/ValidateSourceCandidate.cmake
      - name: Upload source package, checksum, and identity manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mmxisf-source-${{ github.sha }}
          path: dist/source-candidate/
          if-no-files-found: error
          retention-days: 14

  api-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install documentation toolchain
        run: sudo apt-get update && sudo apt-get install -y doxygen libexpat1-dev liblz4-dev libssl-dev libzstd-dev zlib1g-dev
      - name: Configure generated API reference
        run: >-
          cmake -S . -B build-docs
          -DMMXISF_BUILD_DOCS=ON
          -DMMXISF_BUILD_TESTS=OFF
          -DMMXISF_BUILD_TOOLS=OFF
          -DCMAKE_BUILD_TYPE=Release
      - name: Generate API reference
        run: cmake --build build-docs --target mmxisf_docs
      - name: Verify generated entry point
        run: test -s build-docs/api/html/index.html
      - name: Upload generated API reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mmxisf-api-${{ github.sha }}
          path: build-docs/api/html/
          if-no-files-found: error
          retention-days: 14

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang libexpat1-dev liblz4-dev libssl-dev libzstd-dev zlib1g-dev
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-fuzz
          -DMMXISF_BUILD_TESTS=OFF
          -DMMXISF_BUILD_TOOLS=OFF
          -DMMXISF_BUILD_FUZZER=ON
          -DMMXISF_BUILD_FUZZ_SMOKE=ON
          -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-fuzz --parallel
      - name: Configure ThreadSanitizer suite
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-tsan
          -DMMXISF_BUILD_TESTS=ON
          -DMMXISF_BUILD_TOOLS=OFF
          -DMMXISF_BUILD_VIEWER=OFF
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -Wall -Wextra -Wpedantic -Werror -Wno-missing-field-initializers"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"
      - name: Build and run ThreadSanitizer suite
        run: |
          cmake --build build-tsan --parallel
          ctest --test-dir build-tsan --output-on-failure
      - name: Run 20k sanitizer mutations
        run: build-fuzz/mmxisf_fuzz_smoke
      - name: Prepare coverage-guided seed corpus
        run: |
          mkdir -p build-fuzz/corpus build-fuzz/artifacts
          for seed in tests/fuzz_seed*.xisf.b64; do
            base64 --decode "$seed" > "build-fuzz/corpus/$(basename "$seed" .b64)"
          done
          for seed in tests/interop/*.xisf.b64; do
            base64 --decode "$seed" > "build-fuzz/corpus/interop-$(basename "$seed" .b64)"
          done
      - name: Run 20k coverage-guided mutations
        run: >-
          build-fuzz/mmxisf_fuzz_header
          -runs=20000
          -max_len=1048576
          -timeout=10
          -dict=tests/fuzz_header.dict
          -artifact_prefix=build-fuzz/artifacts/
          build-fuzz/corpus
      - name: Retain libFuzzer failure artifact
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libfuzzer-failure
          path: build-fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 7
