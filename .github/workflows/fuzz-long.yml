name: fuzz-long

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-long-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reader-libfuzzer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang libexpat1-dev liblz4-dev libssl-dev libzstd-dev zlib1g-dev
      - name: Configure ASan and UBSan libFuzzer
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-fuzz-long
          -DMMXISF_BUILD_TESTS=OFF
          -DMMXISF_BUILD_TOOLS=OFF
          -DMMXISF_BUILD_FUZZER=ON
          -DMMXISF_BUILD_FUZZ_SMOKE=OFF
          -DCMAKE_BUILD_TYPE=Debug
      - name: Build fuzz target
        run: cmake --build build-fuzz-long --parallel
      - name: Prepare versioned seed corpus
        run: |
          mkdir -p build-fuzz-long/corpus build-fuzz-long/artifacts
          for seed in tests/fuzz_seed*.xisf.b64; do
            base64 --decode "$seed" > "build-fuzz-long/corpus/$(basename "$seed" .b64)"
          done
          for seed in tests/interop/*.xisf.b64; do
            base64 --decode "$seed" > "build-fuzz-long/corpus/interop-$(basename "$seed" .b64)"
          done
      - name: Run 15-minute coverage-guided campaign
        run: >-
          build-fuzz-long/mmxisf_fuzz_header
          -max_total_time=900
          -max_len=1048576
          -timeout=10
          -rss_limit_mb=4096
          -print_final_stats=1
          -dict=tests/fuzz_header.dict
          -artifact_prefix=build-fuzz-long/artifacts/
          build-fuzz-long/corpus
      - name: Retain minimized failure input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libfuzzer-long-failure-${{ github.sha }}
          path: build-fuzz-long/artifacts/
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain evolved corpus
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libfuzzer-long-corpus-${{ github.sha }}
          path: build-fuzz-long/corpus/
          if-no-files-found: error
          retention-days: 14
