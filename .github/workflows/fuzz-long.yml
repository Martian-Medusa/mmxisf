name: fuzz-long

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-long-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reader-libfuzzer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang libexpat1-dev liblz4-dev libssl-dev libzstd-dev zlib1g-dev
      - name: Build and run 15-minute coverage-guided campaign
        env:
          MMXISF_FUZZ_CC: clang
          MMXISF_FUZZ_CXX: clang++
          MMXISF_FUZZ_BUILD_JOBS: 2
        run: tools/run_long_fuzz_campaign.sh
      - name: Retain minimized failure input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libfuzzer-long-failure-${{ github.sha }}
          path: build-fuzz-long/artifacts/
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain evolved corpus
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libfuzzer-long-corpus-${{ github.sha }}
          path: build-fuzz-long/corpus/
          if-no-files-found: error
          retention-days: 14
